modLoader="javafml"
loaderVersion="[${forge_version_int},)"
license="${license}"
issueTrackerURL="${issues}"

[[mods]]
modId="${modid}"
version="${version}"
displayName="${display_name}"
displayURL="${homepage}"
authors="${authors}"
description='''${description}'''
logoFile="${icon}"

[[dependencies.${modid}]]
modId="forge"
mandatory=true
versionRange="[${forge_version_int},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${modid}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.21)"
ordering="NONE"
side="CLIENT"

[[dependencies.${modid}]]
modId="trafficcraft"
mandatory=true
versionRange="${trafficcraft_version}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${modid}]]
modId="dragonlib"
mandatory=true
versionRange="${dragonlib_version}"
ordering="AFTER"
side="CLIENT"