modLoader="javafml"
loaderVersion="[4,)"
license="${license}"
issueTrackerURL="${issues}"

[[mods]]
modId="${modid}"
version="${version}"
displayName="${display_name}"
displayURL="${homepage}"
authors="${authors}"
description='''${description}'''
logoFile="${icon}"

[[dependencies.${modid}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${modid}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},1.21.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.${modid}]]
modId="trafficcraft"
type="required"
versionRange="${trafficcraft_version}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${modid}]]
modId="dragonlib"
type="required"
versionRange="${dragonlib_version}"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="tlcountdown.mixins.json"
