plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // dragonlib-neoforge уже несёт architectury-neoforge внутри себя (jar-in-jar);
    // явную зависимость держим только на этапе компиляции, чтобы не грузить её дважды в рантайме
    modCompileOnly("dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}")

    // MixinExtras — нужен для Architectury Mixin в dev-окружении
    implementation("io.github.llamalad7:mixinextras-neoforge:0.5.4")
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4")

    modImplementation("de.mrjulsen.mcdragonlib:dragonlib-neoforge:${rootProject.minecraft_version}-${rootProject.dragonlib_version}")
    modImplementation("de.mrjulsen.trafficcraft:trafficcraft-neoforge:${rootProject.minecraft_version}-${rootProject.trafficcraft_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
