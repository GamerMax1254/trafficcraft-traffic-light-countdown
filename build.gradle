plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.architectury.dev/' }
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "dev.architectury:architectury-fabric:9.2.14"

    // Forge Config API Port — нужна для DragonLib/TrafficCraft
    modImplementation files("libs/ForgeConfigAPIPort-v8.0.3-1.20.1-Fabric.jar")

    // TrafficCraft
    modImplementation files("libs/trafficcraft-fabric-1.20.1-1.2.0-beta.3.jar")

    // DragonLib
    modImplementation files("libs/dragonlib-fabric-1.20.1-beta-3.0.28.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}