architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modCompileOnly("dev.architectury:architectury:${rootProject.architectury_api_version}")
    modCompileOnly("com.electronwill.night-config:toml:3.6.0")
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}")

    modCompileOnly("de.mrjulsen.mcdragonlib:dragonlib-fabric:${rootProject.minecraft_version}-${rootProject.dragonlib_version}")
    modCompileOnly files("../libs/trafficcraft-fabric-1.20.1-1.2.0-beta.3.jar")
}
